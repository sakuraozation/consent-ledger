# hack-kit — ETHGlobal 用の空の雛形（Hono on Cloudflare Workers）＋ x402 の hello world。
# 提出物ではない。当日は新しい public repo にコピーして、そこからゼロで作る（README 参照）。
# 本番デプロイはしない前提（testnet のみ）。

name = "consent-ledger"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
# 受取アドレス（testnet・自分の EVM アドレスに置き換える）。secret ではないので vars でよい。
PAY_TO = "0x397E6b834ec3ED0f3e6eaf5C6CF89c70D7962111"
# x402 v2 の公開 facilitator（Base Sepolia を無料で検証・決済する）
FACILITATOR_URL = "https://x402.org/facilitator"
# CAIP-2。eip155:84532 = Base Sepolia
NETWORK = "eip155:84532"

# World ID。Developer Portal（IDKit）と sandbox.auth.world.org（for Agents）。
# 値は .dev.vars（git 管理外）に置く。

# ENSv2（Sepolia beta）。委任の権限の正本＝この resolver の役割。
# 登録＝scripts/ens-register.ts / 委任＝scripts/ens-delegate.ts
ENS_NAME = "consentledger.eth"
ENS_RESOLVER = "0x8591D727D6a7317f843de72Bd2D31AB31A2841C9"
ENS_CONSENT_KEY = "consent.bodyscan"
# 事務所役のアドレス（画面と /check がこの役割を見る）
ENS_CUSTODIAN = "0x43e619de6A13ADF126AB4b329b8c89D1d0ae6694"

[[d1_databases]]
binding = "DB"
database_name = "consent-ledger"
database_id = "29bb38c4-4d46-489d-b21b-76ab87555517"
